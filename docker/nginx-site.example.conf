# Example nginx server block for BOSVesFinder (PHP-FPM). Copy and tune for your host.
#
# PHP-FPM listen address — pick ONE that matches your OS/packages:
#   unix:/run/php/php8.2-fpm.sock     Debian/Ubuntu (package php8.2-fpm)
#   unix:/run/php/php-fpm.sock        some distros (single-version default)
#   unix:/var/run/php/php-fpm.sock    older layouts
#   127.0.0.1:9000                    if FPM is configured for TCP
# TLS: terminate HTTPS in this server { } or in an upstream proxy. If the app sits
# behind a TLS-terminating reverse proxy only, set in .env:
#   TRUST_X_FORWARDED_PROTO=1
# and ensure nginx passes: proxy_set_header X-Forwarded-Proto $scheme;
# (This project also honors APP_URL=https://... for session Secure and email links.)

server {
	listen 80;
	server_name vesfinder.example;
	root /var/www/bosvesfinder/public;
	index index.php;

	location / {
		try_files $uri $uri/ /index.php?$query_string;
	}

	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		# When nginx terminates TLS for this site, PHP sees HTTPS:
		# fastcgi_param HTTPS on;
		fastcgi_pass unix:/run/php/php8.2-fpm.sock;
	}
}
